# hopen-agents.conf — 每个 layout 的 agent 派位 + 可选 prompt
#
# 格式：TOML
#   [layout.<代号>]
#   [layout.<代号>.panes.<位置名>]
#   kind   = "<herdr agent kind>"   # 留空 = 该 pane 不启动 agent，留给用户
#   prompt = "<任务文本>"            # 留空 = agent 起来后空闲等输入
#
# 位置名按视觉位置命名；脚本会把实际创建的 pane 映射到这些名字：
#   12  → left / right-top / right-bottom
#   21  → left-top / left-bottom / right
#   13  → left / right-top / right-mid / right-bottom
#   31  → left-top / left-mid / left-bottom / right
#   22  → left-top / left-bottom / right-top / right-bottom
#   111 → left / middle / right
#
# kind 是 Herdr 内置的 agent 枚举值，必须是 `herdr agent start --help` 列出的可取值；
# 不是任意 PATH 可执行文件名。本机实测可用：
#   claude codex pi opencode hermes droid qodercli
# 其它 kind 拼错 / 没装 → hopen.sh 跳过该 pane，其它正常。

# ── 示例：12 = [A 左大][B 右上][C 右下] ────────────────────────────
[layout.12.panes.left]
kind = "opencode"

[layout.12.panes.right-top]
kind = "pi"

[layout.12.panes.right-bottom]
kind = "hermes"

# ── 示例：21 镜像 —— 把 A 改成 claude 试试 ─────────────────────────
[layout.21.panes.left-top]
kind = "claude"

[layout.21.panes.left-bottom]
kind = "pi"

[layout.21.panes.right]
kind = "codex"

# ── 示例：22 2x2 —— 配 4 个 agent ─────────────────────────────────
[layout.22.panes.left-top]
kind = "opencode"

[layout.22.panes.left-bottom]
kind = "pi"

[layout.22.panes.right-top]
kind = "hermes"

[layout.22.panes.right-bottom]
kind = "claude"

# ── 示例：自动发 prompt（可选）────────────────────────────────────
# 取消下面注释 + 启动 `hopen 31` 会自动让 right pane 的 codex 跑这条 prompt
#
# [layout.31.panes.right]
# kind = "codex"
# prompt = "Review the most recent commit and suggest improvements"

# 其它 layout 段不写 = pane 全部留空 shell，按 Cmd+B Alt+N 只开布局不起 agent
